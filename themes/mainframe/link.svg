<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!--
    Ludolog Link en el tema Mainframe: la placa de servicio del Companion, con su ojo troquelado,
    emitiendo. Como en el icono de la app —la gema del Companion con ondas— pero con la materia
    de este tema: las ondas facetadas, tres tramos rectos y cortes francos, sin una curva.

    Lo genera tools/link-marks.py (fuentes de los temas); retocar alli, no aqui. Mismos tres tonos que
    companion.svg, y como alli no son color sino luz.
  -->
  <defs>
    <style>
      .placa   { fill: #6e6e6e; }
      .canto   { fill: #a8a8a8; }
      .grabado { fill: #eaeaea; }
    </style>
  </defs>

